<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyFinder - 항공권 검색</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>✈ SkyFinder</h1>
      <p class="tagline">가장 저렴한 항공권을 한눈에</p>
    </div>
  </header>

  <main class="wrap">
    <section class="search-panel">
      <div class="field">
        <label for="origin">출발지</label>
        <select id="origin"></select>
      </div>
      <div class="field">
        <label for="region">지역</label>
        <select id="region"></select>
      </div>
      <div class="field">
        <label for="destination">도착지</label>
        <select id="destination"></select>
      </div>
      <div class="field">
        <label for="sort">정렬</label>
        <select id="sort">
          <option value="price-asc" selected>가격 낮은 순</option>
          <option value="price-desc">가격 높은 순</option>
          <option value="duration-asc">소요시간 짧은 순</option>
        </select>
      </div>
      <button id="searchBtn">검색</button>
    </section>

    <section class="calendar-panel">
      <h2>날짜별 최저가 <span id="calendarSubtitle" class="calendar-subtitle"></span></h2>
      <div id="priceCalendar" class="price-calendar"></div>
    </section>

    <section class="results">
      <div class="results-header">
        <span id="resultCount">0개 항공권</span>
      </div>
      <div id="flightList" class="flight-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>SkyFinder demo &middot; 샘플 데이터 기반</p>
  </footer>

  <script src="flights.js"></script>
  <script src="script.js"></script>
</body>
</html>
